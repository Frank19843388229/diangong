name: Build iOS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build front-end dist
        run: npm run build

      - name: Install Capacitor ios package
        run: npm install @capacitor/ios

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Fill Podfile & Cap Sync
        run: |
          mkdir -p ios/App
          if [ ! -f ios/App/Podfile ]; then
            echo "platform :ios, '14.0'" > ios/App/Podfile
            echo "use_frameworks!" >> ios/App/Podfile
            echo "" >> ios/App/Podfile
            echo "target 'App' do" >> ios/App/Podfile
            echo "  capacitor_pods" >> ios/App/Podfile
            echo "end" >> ios/App/Podfile
          fi
          npx cap sync ios

      - name: Check Xcode version
        run: xcodebuild -version

      - name: Archive project (No Sign)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Export unsigned IPA
        run: |
          mkdir -p build/ipa
          xcodebuild \
            -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ios/ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA
          path: build/ipa/*.ipa
