name: Build iOS Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build front-end dist
        run: npm run build

      - name: Install Capacitor iOS package
        run: npm install @capacitor/ios

      # 如果你的项目需要用 CocoaPods，保留这段；如果 Capacitor 是用 SPM（Swift Package Manager）的，这段其实可以省略。
      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Fill Podfile & Cap Sync
        run: |
          mkdir -p ios/App
          if [ ! -f ios/App/Podfile ]; then
            echo "platform :ios, '14.0'" > ios/App/Podfile
            echo "use_frameworks!" >> ios/App/Podfile
            echo "" >> ios/App/Podfile
            echo "target 'App' do" >> ios/App/Podfile
            echo "  capacitor_pods" >> ios/App/Podfile
            echo "end" >> ios/App/Podfile
          fi
          npx cap sync ios

      - name: Check Xcode version
        run: xcodebuild -version

      - name: Archive project (No Sign)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package Unsigned IPA manually
        run: |
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r App-unsigned.ipa Payload
          cd ..

      - name: Upload Unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Unsigned-IPA
          path: build/App-unsigned.ipa